  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Anderson Huamancaja Porras",
      "jobTitle": "Desarrollador Full Stack",

    }

  <script>
    // Aplica el tema guardado antes del primer pintado para evitar el parpadeo
    // de fondo claro en usuarios con tema oscuro.
    (function () {
      try {
        var guardado = localStorage.getItem('portafolio:tema');
        var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
        document.documentElement.setAttribute('data-tema', tema);
      } catch (e) { /* modo privado: se queda con el tema por defecto */ }
      try {
        var idioma = localStorage.getItem('portafolio:idioma');
        if (idioma) document.documentElement.setAttribute('lang', idioma);
      } catch (e) { /* idem */ }
    })();
  </script>
</head>

<body>
