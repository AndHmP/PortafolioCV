name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar estilo de código
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar para producción
        run: npm run build
